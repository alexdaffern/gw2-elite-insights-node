# --- logOptimiser: performance/size decisions (see repo TODO.md) ---
# ParseCombatReplay, ComputeDamageModifiers, ComputeCast, RawTimelineArrays,
# ComputeMechanics are intentionally left at their library defaults (false,
# true, true, true, true respectively) - listed here so the choice is
# explicit rather than relying on an unread default.
